experiment_name: stage8_llm_query_understanding
stage: llm_query_understanding
description: >
  Evaluate structured JSON query understanding and behavior-based user profile
  generation with the deterministic local mock LLM client.

input_files:
  - data/processed/query_item_pairs.parquet
  - data/processed/item_metadata.parquet
  - data/processed/train.parquet

output_files:
  - data/processed/llm_query_understanding.parquet
  - data/processed/user_profiles.parquet
  - data/processed/user_profile_embeddings.parquet
  - validation/results/llm_query_understanding_results.csv
  - validation/results/user_profile_results.csv

configs:
  - configs/llm/query_understanding.yaml
  - configs/llm/user_profile.yaml

primary_metrics:
  - schema_valid_rate
  - output_parse_success_rate
  - intent_match_rate
  - category_match_rate
  - avg_latency_ms
  - estimated_cost_per_1000_queries

selection_rule:
  - prioritize schema_valid_rate
  - then output_parse_success_rate
  - then intent_match_rate
  - then lower avg_latency_ms
  - then lower estimated cost

notes:
  - default client is mock
  - no API key required for tests
  - metrics are based on synthetic debug labels and rule-based references
  - GenRec and LLM reranking are not included yet

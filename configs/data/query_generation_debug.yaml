seed: 42

input:
  item_metadata_path: data/processed/item_metadata.parquet
  train_path: data/processed/train.parquet
  val_path: data/processed/val.parquet
  test_path: data/processed/test.parquet

output:
  query_item_pairs_path: data/processed/query_item_pairs.parquet

query_generation:
  queries_per_item: 3
  include_title_queries: true
  include_category_queries: true
  include_brand_queries: true
  include_use_case_queries: true
  include_price_queries: true

intent:
  default_intent: product_search

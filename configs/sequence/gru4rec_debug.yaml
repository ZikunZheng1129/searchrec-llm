seed: 42

input:
  train_path: data/processed/train.parquet
  val_path: data/processed/val.parquet
  test_path: data/processed/test.parquet
  item_metadata_path: data/processed/item_metadata.parquet

output:
  model_dir: artifacts/models/sequence
  checkpoint_path: artifacts/models/sequence/gru4rec_debug.pt
  results_path: validation/results/sequence_results.csv

sequence:
  method: gru4rec
  max_seq_len: 20
  min_seq_len: 2
  eval_split: test
  exclude_seen: true

model:
  embedding_dim: 32
  hidden_dim: 32
  num_layers: 1
  dropout: 0.1

training:
  device: cpu
  batch_size: 16
  epochs: 2
  learning_rate: 0.001
  weight_decay: 0.0
  num_negatives: 20
  loss: sampled_bce
  log_every: 10

evaluation:
  top_k: 20
  k_values:
    - 10
    - 20

seed: 42

experiment:
  name: bm25_title_category_heavy
  change: Small-data BM25 using title/category/brand only, with title and category weights to balance MRR and Recall@10.

input:
  item_metadata_path: data/processed/item_metadata.parquet
  query_item_pairs_path: data/processed/query_item_pairs.parquet

output:
  index_path: data/indexes/retrieval_tuning_bm25_title_category_heavy.pkl
  results_path: validation/results/retrieval_tuning_results.csv

retrieval:
  method: bm25
  top_k: 50
  item_text_fields:
    - title
    - category
    - brand

bm25:
  k1: 1.5
  b: 0.0
  field_weights:
    title: 2.0
    category: 2.0
    brand: 1.0

evaluation:
  split: test
  k_values:
    - 5
    - 10
    - 20
    - 50

seed: 42

experiment:
  name: medium_bm25_recall_weighted
  change: Medium synthetic field-weighted BM25 with category emphasis and no length normalization.

input:
  item_metadata_path: data/interim/retrieval_medium/item_metadata.parquet
  query_item_pairs_path: data/interim/retrieval_medium/query_item_pairs.parquet

output:
  index_path: data/indexes/retrieval_medium_bm25_recall_weighted.pkl
  results_path: validation/results/retrieval_medium_results.csv

retrieval:
  method: bm25
  top_k: 100
  item_text_fields:
    - title
    - category
    - brand
    - description

bm25:
  k1: 1.5
  b: 0.0
  field_weights:
    title: 1.0
    category: 2.0
    brand: 1.0
    description: 1.0

evaluation:
  split: test
  k_values:
    - 5
    - 10
    - 20
    - 50
    - 100

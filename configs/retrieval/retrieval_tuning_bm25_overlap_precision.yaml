seed: 42

experiment:
  name: bm25_overlap_precision
  change: Small-data BM25 top-50 reranked with general title/category/brand overlap to improve early precision before scaling to medium.

input:
  item_metadata_path: data/processed/item_metadata.parquet
  query_item_pairs_path: data/processed/query_item_pairs.parquet

output:
  index_path: data/indexes/retrieval_tuning_bm25_overlap_precision.pkl
  results_path: validation/results/retrieval_tuning_results.csv

retrieval:
  method: overlap_rerank_bm25
  top_k: 50
  item_text_fields:
    - title
    - category
    - brand

bm25:
  k1: 1.5
  b: 0.0

rerank:
  candidate_pool_size: 50
  weights:
    bm25: 0.70
    title_overlap: 0.35
    category_overlap: 0.25
    brand_overlap: 0.20
    description_overlap: 0.00
    rating: 0.05
    popularity: 0.05

evaluation:
  split: test
  k_values:
    - 5
    - 10
    - 20
    - 50

seed: 42

input:
  item_metadata_path: data/processed/item_metadata.parquet
  query_item_pairs_path: data/processed/query_item_pairs.parquet

output:
  index_path: data/indexes/hybrid_debug.pkl
  results_path: validation/results/retrieval_results.csv

retrieval:
  method: hybrid
  top_k: 50

hybrid:
  bm25_weight: 0.5
  dense_weight: 0.5
  score_normalization: minmax

bm25:
  k1: 1.5
  b: 0.75

dense:
  vectorizer: tfidf
  normalize: true
  max_features: 5000

evaluation:
  split: test
  k_values:
    - 10
    - 20
    - 50

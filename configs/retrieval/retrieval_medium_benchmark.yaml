seed: 42

experiment:
  name: medium_bm25_default_benchmark
  change: Medium synthetic benchmark BM25 over title, category, brand, and description.

input:
  item_metadata_path: data/interim/retrieval_medium/item_metadata.parquet
  query_item_pairs_path: data/interim/retrieval_medium/query_item_pairs.parquet

output:
  index_path: data/indexes/retrieval_medium_bm25_benchmark.pkl
  results_path: validation/results/retrieval_medium_results.csv

retrieval:
  method: bm25
  top_k: 100
  item_text_fields:
    - title
    - category
    - brand
    - description

bm25:
  k1: 1.5
  b: 0.75

evaluation:
  split: test
  k_values:
    - 5
    - 10
    - 20
    - 50
    - 100

seed: 42

experiment:
  name: medium_bm25_overlap_balanced
  change: Medium BM25 top-100 reranked with moderate metadata overlap plus rating/popularity tie-breaks for stable candidate handoff.

input:
  item_metadata_path: data/interim/retrieval_medium/item_metadata.parquet
  query_item_pairs_path: data/interim/retrieval_medium/query_item_pairs.parquet

output:
  index_path: data/indexes/retrieval_medium_bm25_overlap_balanced.pkl
  results_path: validation/results/retrieval_medium_results.csv

retrieval:
  method: overlap_rerank_bm25
  top_k: 100
  item_text_fields:
    - title
    - category
    - brand
    - description

bm25:
  k1: 1.5
  b: 0.0
  field_weights:
    title: 1.0
    category: 2.0
    brand: 1.0
    description: 1.0

rerank:
  candidate_pool_size: 100
  weights:
    bm25: 0.85
    title_overlap: 0.20
    category_overlap: 0.15
    brand_overlap: 0.10
    description_overlap: 0.05
    rating: 0.10
    popularity: 0.10

evaluation:
  split: test
  k_values:
    - 5
    - 10
    - 20
    - 50
    - 100

seed: 42

experiment:
  name: medium_hybrid_bm25_dense
  change: Medium synthetic hybrid retrieval with BM25 and TF-IDF dense fusion.

input:
  item_metadata_path: data/interim/retrieval_medium/item_metadata.parquet
  query_item_pairs_path: data/interim/retrieval_medium/query_item_pairs.parquet

output:
  index_path: data/indexes/retrieval_medium_hybrid.pkl
  results_path: validation/results/retrieval_medium_results.csv

retrieval:
  method: hybrid
  top_k: 100
  item_text_fields:
    - title
    - category
    - brand
    - description

hybrid:
  bm25_weight: 0.5
  dense_weight: 0.5
  score_normalization: minmax

bm25:
  k1: 1.5
  b: 0.75

dense:
  vectorizer: tfidf
  normalize: true
  max_features: 5000

evaluation:
  split: test
  k_values:
    - 5
    - 10
    - 20
    - 50
    - 100

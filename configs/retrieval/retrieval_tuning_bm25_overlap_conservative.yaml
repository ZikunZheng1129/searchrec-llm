seed: 42

experiment:
  name: bm25_overlap_conservative
  change: Small-data BM25 rerank with very light metadata overlap, intended as a conservative tie-break over the MRR-optimized baseline.

input:
  item_metadata_path: data/processed/item_metadata.parquet
  query_item_pairs_path: data/processed/query_item_pairs.parquet

output:
  index_path: data/indexes/retrieval_tuning_bm25_overlap_conservative.pkl
  results_path: validation/results/retrieval_tuning_results.csv

retrieval:
  method: overlap_rerank_bm25
  top_k: 50
  item_text_fields:
    - title
    - category
    - brand

bm25:
  k1: 1.5
  b: 0.0

rerank:
  candidate_pool_size: 50
  weights:
    bm25: 1.00
    title_overlap: 0.05
    category_overlap: 0.03
    brand_overlap: 0.03
    description_overlap: 0.00
    rating: 0.02
    popularity: 0.02

evaluation:
  split: test
  k_values:
    - 5
    - 10
    - 20
    - 50

seed: 42

input:
  item_metadata_path: data/processed/item_metadata.parquet
  query_item_pairs_path: data/processed/query_item_pairs.parquet
  train_interactions_path: data/processed/train.parquet

output:
  item_embeddings_path: data/embeddings/item_metadata_embeddings.parquet
  results_path: validation/results/multimodal_results.csv

multimodal:
  method: metadata_only
  split: test
  top_k: 50

metadata_encoder:
  categorical_fields:
    - category
    - brand
  numeric_fields:
    - price
    - avg_rating
    - rating_count
  add_log_numeric:
    - rating_count
  normalize_numeric: true

evaluation:
  k_values:
    - 10
    - 20
    - 50
  cold_start_quantile: 0.25
  long_tail_quantile: 0.25

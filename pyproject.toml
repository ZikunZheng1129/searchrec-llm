[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "searchrec-llm"
version = "0.1.0"
description = "A production-style local search and recommendation platform for e-commerce discovery."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "pyyaml",
    "python-dotenv",
    "pyarrow",
    "torch",
    "fastapi",
    "uvicorn",
    "streamlit",
    "requests",
    "httpx",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"app/api/schemas.py" = ["UP045"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
